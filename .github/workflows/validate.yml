name: Validate

# Runs on every pull request. The schema job checks the sources. The releases
# job checks the catalog entries the pull request touches with
# check-entries.yml, which a submission uses as well.
on:
  pull_request:
    paths:
      - "plugins/**"
      - "partners/**"
      - "schema/**"
      - "scripts/**"
      - "assets/**"
      - "_headers"

permissions:
  contents: read

env:
  PLUGIN_SPEC_DIR: ${{ github.workspace }}/.plugin-spec

jobs:
  schema:
    name: Schema and structural checks
    runs-on: ubuntu-latest
    outputs:
      changed_entries: ${{ steps.changed.outputs.entries }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The catalog and keyring schemas live in the contract repository.
      - uses: actions/checkout@v7
        with:
          repository: nginxui/plugin-spec
          path: .plugin-spec

      - name: node --test
        run: node --test scripts/ci/*.test.mjs scripts/submission/*.test.mjs

      - name: node scripts/validate.mjs
        run: node scripts/validate.mjs

      - id: changed
        name: List plugin entries this PR touches
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          files=$(git diff --name-only --diff-filter=ACM "${base}" "${head}" -- 'plugins/*.json' || true)
          echo "Changed entries:"
          echo "${files}"
          {
            echo "entries<<EOF"
            echo "${files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  releases:
    name: Releases, packages and lint
    needs: schema
    if: needs.schema.outputs.changed_entries != ''
    uses: ./.github/workflows/check-entries.yml
    with:
      entries: ${{ needs.schema.outputs.changed_entries }}
