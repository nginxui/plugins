name: Submit issue

# Turns a "Submit a plugin" issue (.github/ISSUE_TEMPLATE/submit-plugin.yml,
# labelled "submission") into a draft plugins/<id>.json and a pull request.
# Well-known rejection reasons (bad id, no release yet, id already taken)
# post an explanatory comment back on the issue instead of failing the
# workflow — see scripts/ci/submit-issue.mjs's `fail()`.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  submit:
    if: github.event.label.name == 'submission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - id: draft
        name: Draft plugins/<id>.json from the issue form
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/submit-issue.mjs "${GITHUB_EVENT_PATH}"

      - id: cpr
        name: Open a pull request
        if: steps.draft.outputs.result == 'ok'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat(plugins): submit ${{ steps.draft.outputs.plugin_id }}"
          branch: bot/submit-${{ github.event.issue.number }}
          title: "Submit plugin: ${{ steps.draft.outputs.plugin_id }}"
          body: |
            Opened automatically from #${{ github.event.issue.number }} by
            `.github/workflows/submit-issue.yml`.

            ${{ steps.draft.outputs.message }}

            Closes #${{ github.event.issue.number }}
          labels: automated-pr, submission

      - name: Comment on the issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const result = "${{ steps.draft.outputs.result }}"
            const message = ${{ toJSON(steps.draft.outputs.message) }}
            const prNumber = "${{ steps.cpr.outputs.pull-request-number }}"

            let body
            if (result === 'ok' && prNumber) {
              body = `Opened #${prNumber} from this submission.\n\n${message}`
            }
            else if (result === 'error') {
              body = `This submission could not be processed automatically:\n\n${message}\n\nFix the issue above and re-apply the \`submission\` label to try again, or open a pull request by hand (see CONTRIBUTING.md).`
            }
            else {
              body = 'Something went wrong processing this submission automatically. A maintainer will follow up — feel free to open a pull request by hand in the meantime (see CONTRIBUTING.md).'
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
