name: Poll releases

# Every 6 hours, checks each registered plugin's GitHub repository for a
# release newer than what this catalog lists, and opens a pull request
# appending it. A maintainer or the plugin author still reviews and merges
# it — this workflow never pushes straight to plugins/*.json.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - id: poll
        name: Check registered repositories for a newer release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/poll-releases.mjs

      - name: Regenerate v1/index.json
        if: steps.poll.outputs.updated == 'true'
        run: node scripts/build-index.mjs

      - name: Open a pull request
        if: steps.poll.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(plugins): pick up new releases (${{ steps.poll.outputs.updated_ids }})"
          branch: bot/poll-releases
          title: "New release(s): ${{ steps.poll.outputs.updated_ids }}"
          body: |
            Opened automatically by `.github/workflows/poll-releases.yml`
            (`scripts/ci/poll-releases.mjs`).

            One or more registered plugins have a GitHub Release newer than
            what `plugins/*.json` lists. This PR appends the new
            `releases[]` entries and regenerates `v1/index.json`; it does
            not modify any existing release entry.

            Before merging, `validate.yml` will verify each new release's
            `sha256` and the `plugin.sums` signature inside every package as
            usual. Please still skim the diff.
          labels: automated-pr
