name: Build index

# Keeps v1/index.json, the document nginx-ui hosts actually fetch, in sync
# with plugins/*.json, and v1/partners.json, the signed partner keyring, in
# sync with partners/*.json. Pull requests only ever touch the sources and
# codes.json; this is the one workflow allowed to push straight to main.
#
# Run it by hand (workflow_dispatch) after adding or rotating the signing
# secret, so v1/partners.json.minisig is written or refreshed.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "partners/**"
      - "scripts/build-index.mjs"
      - "scripts/build-partners.mjs"
      - "scripts/lib/minisign.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    # Signing and pushing only ever happen on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A real user token would be needed to trigger further workflows
          # from this push; the default GITHUB_TOKEN is fine here since
          # nothing needs to react to this commit besides the next fetch by
          # an nginx-ui host. The full history also gives
          # scripts/build-partners.mjs the time of the last partners/ change.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/build-index.mjs

      - name: Commit v1/index.json if it changed
        run: |
          if git diff --quiet -- v1/index.json; then
            echo "v1/index.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/index.json
          git commit -m "chore: regenerate v1/index.json"
          git push

      - run: node scripts/build-partners.mjs

      # Signs the exact bytes of v1/partners.json with the project's release
      # key. The trusted comment is fixed for a given updated_at, so signing
      # an unchanged file writes the same signature and commits nothing.
      # Without the secret (a fork, or before the key is configured) the
      # keyring is still built and committed, just not signed.
      - name: Sign v1/partners.json
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY_PASSWORD: ${{ secrets.PLUGIN_SIGNING_KEY_PASSWORD }}
          PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.PLUGIN_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_SIGNING_KEY}" ]; then
            echo "::notice title=Partner keyring not signed::The PLUGIN_SIGNING_KEY secret is not set, so v1/partners.json is built but not signed. Hosts ignore a keyring without a valid signature."
            if [ -f v1/partners.json.minisig ] && ! git diff --quiet -- v1/partners.json; then
              echo "::warning title=Stale keyring signature::v1/partners.json changed and v1/partners.json.minisig no longer matches it."
            fi
            exit 0
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          key_file="${RUNNER_TEMP}/release-signing.key"
          trap 'rm -f "${key_file}"' EXIT
          (umask 077 && printf '%s\n' "${PLUGIN_SIGNING_KEY}" >"${key_file}")

          updated_at=$(node -p "JSON.parse(require('fs').readFileSync('v1/partners.json', 'utf8')).updated_at")
          # minisign reads the key password from stdin. A key made with
          # `minisign -G -W` has none and does not read it.
          printf '%s\n' "${PLUGIN_SIGNING_KEY_PASSWORD}" \
            | minisign -S -s "${key_file}" -m v1/partners.json -x v1/partners.json.minisig \
                -t "nginx-ui partner keyring ${updated_at}" >/dev/null
          echo "signed v1/partners.json (updated_at ${updated_at})"

          if [ -z "${PLUGIN_SIGNING_PUBLIC_KEY}" ]; then
            echo "::notice title=Keyring signature not checked::Set the PLUGIN_SIGNING_PUBLIC_KEY repository variable to the release public key to check the signing key here."
            exit 0
          fi
          public_key=$(printf '%s\n' "${PLUGIN_SIGNING_PUBLIC_KEY}" | grep -Ev '^untrusted comment:' | tr -d '[:space:]')
          minisign -V -q -m v1/partners.json -x v1/partners.json.minisig -P "${public_key}"
          echo "v1/partners.json.minisig verifies against PLUGIN_SIGNING_PUBLIC_KEY"

      - name: Commit v1/partners.json if it changed
        run: |
          git add v1/partners.json
          if [ -f v1/partners.json.minisig ]; then
            git add v1/partners.json.minisig
          fi
          if git diff --cached --quiet; then
            echo "v1/partners.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate v1/partners.json"
          git push
