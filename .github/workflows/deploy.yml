name: Deploy

# Builds the site of plugins.nginxui.com with scripts/build-catalog.mjs and
# deploys it to Cloudflare Pages. Nothing it builds is committed: the releases
# come from the GitHub Releases of every plugin, and the published catalog
# pins the packages of the releases it already lists.
#
# Runs on a change of main, every hour, by hand, and on a "plugin-released"
# repository dispatch the release webhook sends. A scheduled run that builds
# the same catalog and keyring as the published ones deploys nothing.
#
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit), CLOUDFLARE_ACCOUNT_ID, and the
# organization PLUGIN_SIGNING_KEY that signs v1/partners.json. Variables:
# CLOUDFLARE_PAGES_PROJECT (default nginxui-plugins), CATALOG_URL (default
# https://plugins.nginxui.com) and PLUGIN_SIGNING_PUBLIC_KEY.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      first_deploy:
        description: Build without a published catalog, only for the very first deploy
        type: boolean
        default: false
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build-partners.mjs reads the time of the last partners/ change.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: node --test scripts/ci/*.test.mjs

      - run: node scripts/validate.mjs

      # Releases that did not verify, so the hourly build does not download
      # them again until their packages or the keys change. A cache entry is
      # immutable, every run saves a new one and restores the newest.
      - uses: actions/cache@v6
        with:
          path: .cache/verify-failures.json
          key: verify-failures-${{ github.run_id }}
          restore-keys: verify-failures-

      - id: build
        name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_URL: ${{ vars.CATALOG_URL }}
          PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.PLUGIN_SIGNING_PUBLIC_KEY }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          if [ "${FIRST_DEPLOY}" = "true" ]; then
            node scripts/build-catalog.mjs --out dist --failures .cache/verify-failures.json --published none
          else
            node scripts/build-catalog.mjs --out dist --failures .cache/verify-failures.json
          fi

      # The trusted comment is fixed for a given updated_at and Ed25519 is
      # deterministic, so an unchanged keyring gets the same signature.
      - name: Sign v1/partners.json
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY_PASSWORD: ${{ secrets.PLUGIN_SIGNING_KEY_PASSWORD }}
          PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.PLUGIN_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_SIGNING_KEY}" ]; then
            echo "::warning title=Partner keyring not signed::PLUGIN_SIGNING_KEY is not set. Hosts ignore a keyring without a valid signature."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key_file="${RUNNER_TEMP}/plugin-signing.key"
          trap 'rm -f "${key_file}"' EXIT
          (umask 077 && printf '%s\n' "${PLUGIN_SIGNING_KEY}" >"${key_file}")
          updated_at=$(node -p "JSON.parse(require('fs').readFileSync('dist/v1/partners.json', 'utf8')).updated_at")
          # minisign reads the password from stdin, a key made with -W has none.
          printf '%s\n' "${PLUGIN_SIGNING_KEY_PASSWORD}" \
            | minisign -S -s "${key_file}" -m dist/v1/partners.json -x dist/v1/partners.json.minisig \
                -t "nginx-ui partner keyring ${updated_at}" >/dev/null
          public_key=$(printf '%s\n' "${PLUGIN_SIGNING_PUBLIC_KEY}" | grep -Ev '^untrusted comment:' | tr -d '[:space:]')
          if [ -n "${public_key}" ]; then
            minisign -V -q -m dist/v1/partners.json -x dist/v1/partners.json.minisig -P "${public_key}"
            echo "v1/partners.json.minisig verifies against PLUGIN_SIGNING_PUBLIC_KEY"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nginxui-plugins' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning title=Not deployed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, the site is kept as an artifact only."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name "${PAGES_PROJECT}" --branch main --commit-hash "${GITHUB_SHA}"

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7
