name: Submit a plugin
description: List a plugin in the Nginx UI plugin catalog.
title: "plugin: <your plugin name>"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/nginxui/plugins/blob/main/CONTRIBUTING.md) first.

        This issue is the whole submission. The checks run when you submit it
        and post the result and a preview of the listing as a comment. To
        change something, edit this issue and the checks run again. A
        maintainer lists the plugin by approving the issue, and from then on
        every release of your repository is listed on its own.

        The repository has to agree to be listed: submit from the account
        that owns it, be a public member of the organization that owns it, or
        add the `nginx-ui-plugin` topic to it.
  - type: input
    id: repository_url
    attributes:
      label: Repository URL
      description: The public GitHub repository whose releases publish the plugin. The plugin id and name come from the plugin.json of its newest release.
      placeholder: https://github.com/<owner>/<repo>
    validations:
      required: true
  - type: textarea
    id: author_public_key
    attributes:
      label: Primary public key
      description: >
        The contents of primary.pub from `nginx-ui plugin key init`. It
        certifies the signing keys of your packages, see
        [Signing Keys](https://nginxui.com/plugin/signing#signing-keys).
      placeholder: |
        untrusted comment: minisign public key ...
        RW....................................
    validations:
      required: true
  - type: dropdown
    id: categories
    attributes:
      label: Categories
      description: One to three. Without a choice they come from the capabilities of the plugin.
      multiple: true
      options:
        - certificates
        - dns
        - security
        - traffic
        - monitoring
        - logs
        - analytics
        - notifications
        - backup
        - ai
        - templates
        - languages
        - integrations
        - tools
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The newest release has the packages of the plugin, signed with a signing key the primary key above certified.
          required: true
        - label: My plugin.json passes `nginx-ui plugin lint` with no errors.
          required: true
        - label: My plugin id follows the naming rule and is not under com.nginxui.*.
          required: true
        - label: I have read CONTRIBUTING.md.
          required: true
