name: Submit a plugin
description: Ask for a new plugin to be added to the nginx-ui catalog.
title: "plugin: <your plugin id>"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a plugin! Read `CONTRIBUTING.md` first — in
        particular, your repository needs at least one GitHub Release before
        this can be validated and merged.

        Filing this form opens an automated pull request
        (`.github/workflows/submit-issue.yml`) that adds a draft
        `plugins/<id>.json` for you. You can also skip this form and open
        that pull request yourself.
  - type: input
    id: repository_url
    attributes:
      label: Repository URL
      description: The plugin's public GitHub repository.
      placeholder: https://github.com/<owner>/<repo>
    validations:
      required: true
  - type: input
    id: plugin_id
    attributes:
      label: Plugin id
      description: >
        Reverse-DNS style, e.g. io.github.<owner>.<name>. Must not start with
        com.nginxui. (reserved for official plugins). <owner> must match the
        GitHub account that owns the repository above.
      placeholder: io.github.example.mydns
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Your GitHub handle, or another way maintainers can reach you.
      placeholder: "@your-github-handle"
    validations:
      required: true
  - type: dropdown
    id: trust_requested
    attributes:
      label: Trust level requested
      description: >
        New submissions are listed as "community" regardless of this answer;
        see CONTRIBUTING.md#applying-for-verified-trust for how to apply for
        "verified" after you have a community release in production use.
      options:
        - community
      default: 0
    validations:
      required: true
  - type: textarea
    id: author_public_key
    attributes:
      label: Minisign public key
      description: >
        Required before your submission can be merged (community releases
        are verified against this key). Paste the contents of your
        plugin.pub, or the single-line public key minisign prints. You can
        add this in a follow-up comment or commit if you do not have it yet.
      placeholder: |
        untrusted comment: minisign public key ...
        RW....................................
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: My repository has at least one GitHub Release with a packaged .tar.gz asset.
          required: true
        - label: My plugin.json passes `nginx-ui plugin lint` with no errors.
          required: true
        - label: My plugin id follows the naming rule and is not under com.nginxui.*.
          required: true
        - label: I have read CONTRIBUTING.md.
          required: true
