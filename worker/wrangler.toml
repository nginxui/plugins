# The release webhook of the catalog, see README.md next to this file.
name = "nginxui-plugins-release-hook"
# The account of the catalog Pages project, so wrangler never has to ask.
account_id = "9b281dd2ab36041a82b8b35a7a14c5de"
main = "src/index.js"
compatibility_date = "2026-10-01"
# The webhook URL of the catalog GitHub App is https://plugin-hooks.nginxui.com/github.
workers_dev = false
preview_urls = false
routes = [{ pattern = "plugin-hooks.nginxui.com", custom_domain = true }]

[vars]
CATALOG_URL = "https://plugins.nginxui.com"
CATALOG_REPO = "nginxui/plugins"
DEPLOY_WORKFLOW = "deploy.yml"
DEPLOY_REF = "main"

# Secrets, set once with `npx wrangler secret put <NAME>`:
#   WEBHOOK_SECRET          webhook secret of the catalog GitHub App
#   DEPLOY_APP_ID           id of the deploy GitHub App
#   DEPLOY_APP_PRIVATE_KEY  private key of the deploy GitHub App

# The developer portal's database (nginxui/plugin-portal), where installation
# events are recorded so the sender can claim the repository.
[[d1_databases]]
binding = "PORTAL_DB"
database_name = "portal"
database_id = "aebdd686-03c1-4ef0-8146-adc51e848155"
